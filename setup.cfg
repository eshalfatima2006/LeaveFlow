[mutmut]
source_paths =
    backend/leave
    backend/config/settings.py
do_not_mutate =
    backend/leave/migrations/*
    backend/leave/tests.py
also_copy = backend/config
pytest_add_cli_args = --override-ini=pythonpath=mutants/backend
pytest_add_cli_args_test_selection = tests/
use_git_change_detection = false
process_isolation = fork
